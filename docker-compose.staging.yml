version: "3.9"

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/beza-platform/beza-platform:latest}
    container_name: beza-staging-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: staging
      APP_DEBUG: "true"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: beza_platform
      DB_USERNAME: beza_user
      DB_PASSWORD: "${DB_PASSWORD}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - beza-staging-network

  db:
    image: mysql:8.0
    container_name: beza-staging-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: beza_platform
      MYSQL_USER: beza_user
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    volumes:
      - staging-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "3306:3306"
    networks:
      - beza-staging-network

  redis:
    image: redis:7-alpine
    container_name: beza-staging-redis
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - staging-redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - beza-staging-network

  nginx:
    image: nginx:1.25-alpine
    container_name: beza-staging-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      app:
        condition: service_healthy
    networks:
      - beza-staging-network

volumes:
  staging-db-data:
    name: beza-staging-db-data
  staging-redis-data:
    name: beza-staging-redis-data

networks:
  beza-staging-network:
    name: beza-staging-network
    driver: bridge
