version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beza-app
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      - ./frontend:/var/www/frontend
      - ./storage:/var/www/html/storage
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: beza_platform
      DB_USERNAME: beza_user
      DB_PASSWORD: "${DB_PASSWORD}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - beza-network

  db:
    image: mysql:8.0
    container_name: beza-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: beza_platform
      MYSQL_USER: beza_user
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "3306:3306"
    networks:
      - beza-network

  redis:
    image: redis:7-alpine
    container_name: beza-redis
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - beza-network

  nginx:
    image: nginx:1.25-alpine
    container_name: beza-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/admin/.next:/var/www/frontend/admin/.next
      - ./frontend/wap/.next:/var/www/frontend/wap/.next
    depends_on:
      - app
    networks:
      - beza-network

volumes:
  db-data:
  redis-data:

networks:
  beza-network:
    driver: bridge
