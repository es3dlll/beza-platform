openapi: 3.1.0
info:
  title: Beza Platform — Admin Agent Oversight API | رقابة المشرف على الوكلاء
  description: >
    واجهات إدارة ومراقبة الوكلاء — قائمة الوكلاء، العمولات، التسويات، التنبيهات الأمنية.


    Admin agent oversight APIs — agent list, commissions, settlements, fraud alerts.


    **المصادقة:** جميع النقاط تتطلب كعكة `admin_token` (Sanctum) مع صلاحية دقيقة.


    **Authentication:** All endpoints require `admin_token` cookie (Sanctum)
    with fine-grained permission checks.
  version: "1.0.0"
  contact:
    name: Beza Platform
    url: https://beza.sy

servers:
  - url: https://api.beza.sy/v1
    description: الإنتاج — Production
  - url: https://staging.api.beza.sy/v1
    description: التجريب — Staging

tags:
  - name: Agents
    description: إدارة الوكلاء — Agent Management
  - name: Commissions
    description: إدارة العمولات — Commission Management
  - name: Settlements
    description: إدارة التسويات — Settlement Management
  - name: Fraud Alerts
    description: التنبيهات الأمنية — Security Alerts

paths:
  # ==========================================================================
  # GET /admin/agents
  # ==========================================================================
  /admin/agents:
    get:
      summary: قائمة الوكلاء
      description: >
        عرض قائمة الوكلاء مع إمكانية الفلترة حسب الحالة، المدينة، والرصيد.


        List all agents with filtering by status, region, and balance.
      operationId: listAgents
      tags: [Agents]
      security:
        - adminCookieAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, active, suspended, closed]
          description: فلترة حسب الحالة
        - name: region
          in: query
          schema:
            type: string
          description: فلترة حسب المدينة
        - name: search
          in: query
          schema:
            type: string
          description: بحث في الاسم التجاري أو رقم الترخيص
        - name: balance_min
          in: query
          schema:
            type: integer
            minimum: 0
          description: الحد الأدنى للرصيد (فلس)
        - name: balance_max
          in: query
          schema:
            type: integer
            minimum: 0
          description: الحد الأعلى للرصيد (فلس)
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
            maximum: 100
      responses:
        "200":
          description: تم جلب القائمة بنجاح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ==========================================================================
  # GET /admin/agents/{id}
  # ==========================================================================
  /admin/agents/{id}:
    get:
      summary: تفاصيل وكيل
      description: >
        عرض تفاصيل كاملة لوكيل معين بما في ذلك آخر المعاملات والعمولات المعلقة.


        Get full agent detail including recent transactions and pending commissions.
      operationId: getAgentDetail
      tags: [Agents]
      security:
        - adminCookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: تم جلب التفاصيل بنجاح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ==========================================================================
  # GET /admin/agents/{id}/commissions
  # ==========================================================================
  /admin/agents/{id}/commissions:
    get:
      summary: سجل عمولات وكيل
      description: >
        عرض سجل العمولات المعلقة والمصروفة لوكيل معين مع إمكانية الفلترة.


        View commission history for a specific agent with filtering.
      operationId: getAgentCommissions
      tags: [Commissions]
      security:
        - adminCookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [accrued, settled, voided]
          description: فلترة حسب الحالة
        - name: type
          in: query
          schema:
            type: string
          description: فلترة حسب النوع
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
            maximum: 100
      responses:
        "200":
          description: تم جلب العمولات بنجاح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ==========================================================================
  # POST /admin/commissions/{id}/approve
  # ==========================================================================
  /admin/commissions/{id}/approve:
    post:
      summary: اعتماد عمولة
      description: >
        الموافقة على عمولة معلقة. يتم إضافة المبلغ لرصيد الوكيل وتسجيل القيد
        في دفتر الأستاذ للامتثال المالي (WORM). لا يمكن اعتماد العمولة مرتين.


        Approve an accrued commission. The amount is added to the agent's balance
        and recorded in the ledger for WORM compliance. Cannot approve twice.
      operationId: approveCommission
      tags: [Commissions]
      security:
        - adminCookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 500
                  description: ملاحظة
      responses:
        "200":
          description: تم اعتماد العمولة بنجاح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproveResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: لا يمكن اعتماد العمولة في حالتها الحالية
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==========================================================================
  # GET /admin/agents/{id}/settlements
  # ==========================================================================
  /admin/agents/{id}/settlements:
    get:
      summary: سجل تسويات وكيل
      description: >
        عرض سجل التسويات المالية لوكيل معين.


        View settlement history for a specific agent.
      operationId: getAgentSettlements
      tags: [Settlements]
      security:
        - adminCookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, completed, approved, failed]
          description: فلترة حسب الحالة
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
            maximum: 100
      responses:
        "200":
          description: تم جلب التسويات بنجاح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ==========================================================================
  # POST /admin/settlements/{id}/approve
  # ==========================================================================
  /admin/settlements/{id}/approve:
    post:
      summary: اعتماد تسوية مالية
      description: >
        اعتماد تسوية مالية لوكيل. يتم إضافة صافي المبلغ لرصيد الوكيل وتسجيله
        في دفتر الأستاذ (WORM).


        Approve a financial settlement for an agent. Adds the net amount
        to the agent's balance and records in the ledger (WORM).
      operationId: approveSettlement
      tags: [Settlements]
      security:
        - adminCookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 500
                  description: ملاحظة
      responses:
        "200":
          description: تم اعتماد التسوية بنجاح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproveResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  # ==========================================================================
  # GET /admin/fraud-alerts
  # ==========================================================================
  /admin/fraud-alerts:
    get:
      summary: قائمة التنبيهات الأمنية
      description: >
        عرض التنبيهات الأمنية للوكلاء مصنفة حسب الخطورة مع إمكانية الفلترة.


        List fraud alerts for agents sorted by severity with filtering.
      operationId: listFraudAlerts
      tags: [Fraud Alerts]
      security:
        - adminCookieAuth: []
      parameters:
        - name: severity
          in: query
          schema:
            type: string
            enum: [low, medium, high, critical]
          description: فلترة حسب الخطورة
        - name: status
          in: query
          schema:
            type: string
            enum: [open, investigating, resolved]
          description: فلترة حسب الحالة
        - name: type
          in: query
          schema:
            type: string
          description: فلترة حسب النوع
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
            maximum: 100
      responses:
        "200":
          description: تم جلب التنبيهات بنجاح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FraudAlertListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ==========================================================================
  # POST /admin/fraud-alerts/{id}/resolve
  # ==========================================================================
  /admin/fraud-alerts/{id}/resolve:
    post:
      summary: حل تنبيه أمني
      description: >
        إغلاق تنبيه أمني مع تدوين الإجراء المتخذ (تحقق، تجاهل، حظر الوكيل، تصعيد).


        Resolve a fraud alert with the action taken (investigate, dismiss,
        block agent, escalate).
      operationId: resolveFraudAlert
      tags: [Fraud Alerts]
      security:
        - adminCookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [investigate, dismiss, block_agent, escalate]
                  description: الإجراء
                note:
                  type: string
                  maxLength: 500
                  description: ملاحظة
      responses:
        "200":
          description: تم حل التنبيه بنجاح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproveResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: لا يمكن حل التنبيه في حالته الحالية
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    adminCookieAuth:
      type: apiKey
      in: cookie
      name: admin_token
      description: >
        كعكة Sanctum للمصادقة الإدارية تحتوي على رمز مميز بصلاحية `admin`.


        Sanctum cookie for admin authentication with `admin` ability.

  schemas:
    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer

    AgentSummary:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        business_name:
          type: string
        license_number:
          type: string
        license_expiry:
          type: string
          format: date
        commission_rate:
          type: number
          format: float
        daily_deposit_limit:
          type: integer
        daily_withdrawal_limit:
          type: integer
        balance:
          type: integer
          description: الرصيد الحالي (فلس)
        status:
          type: string
          enum: [pending, active, suspended, closed]
        region:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        user:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            email:
              type: string
            phone:
              type: string

    AgentDetail:
      allOf:
        - $ref: "#/components/schemas/AgentSummary"
        - type: object
          properties:
            commissions:
              type: array
              items:
                $ref: "#/components/schemas/CommissionSummary"
            transactions:
              type: array
              items:
                $ref: "#/components/schemas/TransactionSummary"

    CommissionSummary:
      type: object
      properties:
        id:
          type: integer
        agent_transaction_id:
          type: integer
          nullable: true
        type:
          type: string
        amount:
          type: integer
        currency:
          type: string
        rate:
          type: number
        status:
          type: string
          enum: [accrued, settled, voided]
        settled_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    CommissionFull:
      allOf:
        - $ref: "#/components/schemas/CommissionSummary"
        - type: object
          properties:
            transaction:
              type: object
              nullable: true
              properties:
                id:
                  type: integer
                type:
                  type: string
                amount:
                  type: integer
                currency:
                  type: string
                created_at:
                  type: string
                  format: date-time

    SettlementSummary:
      type: object
      properties:
        id:
          type: integer
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        total_volume:
          type: integer
        total_commission:
          type: integer
        net_amount:
          type: integer
        currency:
          type: string
        status:
          type: string
          enum: [pending, completed, approved, failed]
        processed_at:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    TransactionSummary:
      type: object
      properties:
        id:
          type: integer
        agent_id:
          type: integer
        user_id:
          type: integer
        type:
          type: string
          enum: [cash_in, cash_out]
        amount:
          type: integer
        currency:
          type: string
        fee:
          type: integer
        status:
          type: string
        created_at:
          type: string
          format: date-time

    FraudAlertSummary:
      type: object
      properties:
        id:
          type: integer
        agent_id:
          type: integer
        type:
          type: string
        severity:
          type: string
          enum: [low, medium, high, critical]
        description:
          type: string
        status:
          type: string
          enum: [open, investigating, resolved]
        resolution:
          type: string
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        agent:
          type: object
          properties:
            id:
              type: integer
            business_name:
              type: string
            region:
              type: string
              nullable: true
        resolver:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string

    ApproveResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            id:
              type: integer
            status:
              type: string
            settled_at:
              type: string
              format: date-time
              nullable: true
            processed_at:
              type: string
              format: date-time
              nullable: true
            resolved_at:
              type: string
              format: date-time
              nullable: true

    AgentListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/AgentSummary"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    AgentDetailResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/AgentDetail"

    CommissionListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/CommissionFull"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    SettlementListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/SettlementSummary"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    FraudAlertListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/FraudAlertSummary"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

  responses:
    Unauthorized:
      description: غير مصادق — Unauthenticated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: غير مصرح — Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: غير موجود — Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unprocessable:
      description: طلب غير قابل للمعالجة — Unprocessable entity
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
