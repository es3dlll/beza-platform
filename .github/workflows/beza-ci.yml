name: Beza CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, sqlite, intl

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Copy deprecation baseline
        run: cp deprecation-baseline.xml . || true

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run feature tests
        run: php artisan test --testsuite=Feature --use-baseline=deprecation-baseline.xml --stop-on-failure

      - name: Generate OpenAPI spec
        run: php artisan openapi:generate

      - name: Check OpenAPI spec
        run: php artisan openapi:generate && git diff --exit-code backend/docs/specs/openapi.yaml || echo "::warning::OpenAPI spec may have drifted. Run: php artisan openapi:generate"

      - name: Test Summary
        if: always()
        run: echo "Tests completed. Check logs for details."
