name: Beza CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, sqlite, intl

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run feature tests
        run: php artisan test --testsuite=Feature

      - name: Generate OpenAPI spec
        run: php artisan openapi:generate

      - name: Check OpenAPI spec is up-to-date
        run: git diff --exit-code -- docs/specs/openapi.yaml || (echo "OpenAPI spec is outdated. Run 'php artisan openapi:generate' and commit the changes." && exit 1)
