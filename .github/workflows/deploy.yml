name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: beza_testing
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, redis, bcmath, mbstring, xml, zip
          coverage: none

      - name: Backend - Install dependencies
        working-directory: backend
        run: composer install --no-interaction --optimize-autoloader

      - name: Backend - Prepare environment
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Backend - Run migrations
        working-directory: backend
        run: php artisan migrate --env=testing --force

      - name: Backend - Run PHPUnit tests
        working-directory: backend
        run: php vendor/bin/phpunit --configuration phpunit.xml

      - name: Backend - Generate OpenAPI spec
        working-directory: backend
        run: php artisan openapi:generate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend Admin - Install dependencies
        working-directory: frontend/admin
        run: npm ci

      - name: Frontend Admin - Lint
        working-directory: frontend/admin
        run: npm run lint

      - name: Frontend WAP - Install dependencies
        working-directory: frontend/wap
        run: npm ci

      - name: Frontend WAP - Lint
        working-directory: frontend/wap
        run: npm run lint

  docker-build:
    name: Build and push Docker image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY || 'ghcr.io' }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_REGISTRY || 'ghcr.io' }}/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: production

  deploy-staging:
    name: Deploy to staging
    needs: docker-build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.beza-platform.com

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        env:
          IMAGE_TAG: ${{ needs.docker-build.outputs.image-tag }}
          IMAGE: ${{ secrets.DOCKER_REGISTRY || 'ghcr.io' }}/${{ github.repository }}:${{ github.sha }}
        run: |
          echo "=== Deploying to staging ==="
          echo "Host:       ${{ secrets.STAGING_HOST }}"
          echo "User:       ${{ secrets.STAGING_USER }}"
          echo "Image:      ${IMAGE}"
          echo "Tags:       ${IMAGE_TAG}"
          echo ""
          echo "--- Placeholder: SSH deployment ---"
          echo "The following commands would execute on the remote host:"
          echo ""
          echo "  ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'EOF'"
          echo "    set -e"
          echo "    cd /opt/beza-platform"
          echo "    docker compose pull app"
          echo "    docker compose up -d --force-recreate app"
          echo "    docker image prune -f"
          echo "    echo 'Deployment complete'"
          echo "EOF"
          echo ""
          echo "=== Deployment simulation complete ==="
