version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beza-app
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./storage:/var/www/storage
    networks:
      - beza
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

  nginx:
    image: nginx:1.25-alpine
    container_name: beza-nginx
    ports:
      - "${APP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - .:/var/www
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - beza
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: beza-mysql
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-beza}"
      MYSQL_USER: "${DB_USERNAME:-beza}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-password}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - beza-mysql:/var/lib/mysql
    networks:
      - beza
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: beza-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - beza-redis:/data
    networks:
      - beza
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: beza-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-beza}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-password}"
      RABBITMQ_DEFAULT_VHOST: "${RABBITMQ_VHOST:-/}"
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - beza-rabbitmq:/var/lib/rabbitmq
    networks:
      - beza

  mailpit:
    image: axllent/mailpit:latest
    container_name: beza-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - beza

volumes:
  beza-mysql:
  beza-redis:
  beza-rabbitmq:

networks:
  beza:
    driver: bridge
